        </svg>
        <sc-if value="{{ showRadar }}" hint-placeholder-val="{{ true }}">

          </div>
        </sc-if>
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="0">
          <div style="position:absolute;left:{{ d.x }}%;top:{{ d.y }}%;width:0;height:0;z-index:3">
            <sc-if value="{{ d.ping }}" hint-placeholder-val="{{ false }}">
              <span data-anim="" style="position:absolute;left:-21px;top:-21px;width:42px;height:42px;border:1.5px solid var(--color-accent-900,#4a0d05);border-radius:50%;opacity:0;animation:om-ping 2.8s cubic-bezier(.23,1,.32,1) {{ d.pingDelay }} infinite"></span>
            </sc-if>
            <span data-anim="" style="position:absolute;left:-4px;top:-4px;width:8px;height:8px;background:var(--color-accent,#ec3013);border-radius:50%;box-shadow:0 0 0 2px #fff;animation:om-pop .4s cubic-bezier(.23,1,.32,1) {{ d.delay }} both"></span>
          </div>
        </sc-for>
        <sc-if value="{{ showCities }}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{ labels }}" as="c" hint-placeholder-count="0">
            <span data-anim="" style="position:absolute;z-index:4;left:{{ c.lx }}%;top:{{ c.ly }}%;transform:{{ c.tf }};background:#fff;color:var(--color-accent-700,#a01206);font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 5px;white-space:nowrap;animation:om-fade .45s ease-out {{ c.delay }} both">{{ c.name }}</span>

    <div data-anim="" style="animation:om-rise .6s cubic-bezier(.23,1,.32,1) .55s both">

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 932}, &quot;showCities&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Carte&quot;}, &quot;showRadar&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Carte&quot;}, &quot;showRadio&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Pied d'écran&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cities = [
      { name: 'Saint-Denis', x: 37.3, y: 1.4, side: 'below', ping: true },
      { name: 'Le Port', x: 12.2, y: 12.6 },
      { name: 'Saint-André', x: 69.8, y: 17.7, side: 'right' },
      { name: 'Saint-Paul', x: 8.7, y: 26.6, side: 'right' },
      { name: 'Saint-Benoît', x: 80, y: 31.3, side: 'left', ping: true },
      { name: 'Cilaos', x: 41.1, y: 50.6 },
      { name: 'Saint-Leu', x: 11.6, y: 57.7, side: 'right', ping: true },
      { name: 'Le Tampon', x: 48.2, y: 78.2, side: 'right' },
      { name: 'Saint-Pierre', x: 42.2, y: 90.3, side: 'left', ping: true }
    ];
    const dots = cities.map((c, i) => ({
      x: c.x, y: c.y, ping: !!c.ping,
      delay: (1.7 + i * 0.07).toFixed(2) + 's',
      pingDelay: (2.6 + i * 0.4).toFixed(2) + 's'
    }));
    const labels = cities.filter(c => c.side).map((c, i) => ({
      name: c.name,
      lx: c.side === 'left' ? c.x - 3.5 : c.x + 3.5,
      ly: c.side === 'below' ? c.y + 5.5 : c.y,
      tf: c.side === 'left' ? 'translate(-100%,-50%)' : 'translateY(-50%)',
      delay: (2.05 + i * 0.06).toFixed(2) + 's'
    }));
    return {
      dots, labels,
      showCities: this.props.showCities ?? true,
      showRadar: this.props.showRadar ?? true,
      showRadio: this.props.showRadio ?? true
    };
  }
}
</script>
