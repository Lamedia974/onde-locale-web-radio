name: Deploy to GitHub Pages

# Publie la racine du dépôt en poussant main vers la branche gh-pages —
# GitHub Pages se sert de cette branche (activée automatiquement à sa création).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publier main sur gh-pages
        run: git push --force origin HEAD:gh-pages
