[build]
  publish = "."
  command = ""

# Alerte Infos vivait sous /alerte-infos/ avant de devenir la racine.
[[redirects]]
  from = "/alerte-infos/*"
  to = "/:splat"
  status = 301
  force = true

# Feuilles de l'ancienne web radio : retirées du dépôt, mais le cache de build
# Netlify continue de les servir — on les rend introuvables explicitement.
[[redirects]]
  from = "/styles.css"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/script.js"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
